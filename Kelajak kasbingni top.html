<head>

<title>Kelajak kasbingni top</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1c2033;--muted:#667;--accent:#4f46e5;--accent2:#7c3aed;--line:#e3e5ef;--bar:#e8e9f5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12131c;--card:#1c1e2c;--text:#eef0fa;--muted:#a3a7c0;--accent:#8b87ff;--accent2:#b18cff;--line:#2d3046;--bar:#2a2d44}}
:root[data-theme="dark"]{--bg:#12131c;--card:#1c1e2c;--text:#eef0fa;--muted:#a3a7c0;--accent:#8b87ff;--accent2:#b18cff;--line:#2d3046;--bar:#2a2d44}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding:24px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin-top:16px}
h1{font-size:2rem;margin:8px 0;line-height:1.2}
h2{font-size:1.3rem;margin:0 0 16px}
p{color:var(--muted);margin:8px 0}
.hero{text-align:center;padding-top:24px}
.emoji{font-size:3rem}
button{font:inherit;cursor:pointer;border:0}
.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:14px 28px;border-radius:12px;font-weight:600;margin-top:16px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--text);border:2px solid var(--line);padding:14px 16px;border-radius:12px;margin-top:10px}
.opt:hover{border-color:var(--accent)}
.prog{height:8px;background:var(--bar);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.small{font-size:.85rem;color:var(--muted);margin-bottom:8px}
.row{margin:12px 0}
.row b{display:flex;justify-content:space-between;font-size:.95rem}
.bar{height:10px;background:var(--bar);border-radius:99px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.tag{display:inline-block;background:var(--bar);color:var(--text);padding:5px 12px;border-radius:99px;margin:4px 4px 0 0;font-size:.9rem}
.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent);padding:12px 24px;border-radius:12px;font-weight:600;margin-top:16px}
.hide{display:none}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1}
.card{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);background:color-mix(in srgb,var(--card) 84%,transparent);box-shadow:0 14px 34px rgba(30,30,80,.18);transition:transform .15s ease-out;will-change:transform}
.emoji{display:inline-block;animation:spin 6s linear infinite}
@keyframes spin{from{transform:perspective(400px) rotateY(0)}to{transform:perspective(400px) rotateY(360deg)}}
.primary{box-shadow:0 6px 0 #3730a3,0 14px 22px rgba(0,0,0,.25);transition:transform .1s,box-shadow .1s}
.primary:active{transform:translateY(5px);box-shadow:0 1px 0 #3730a3,0 4px 8px rgba(0,0,0,.25)}
.opt{box-shadow:0 4px 0 var(--line);transition:transform .12s,box-shadow .12s,border-color .12s}
.opt:hover{transform:translateY(-3px);box-shadow:0 8px 0 var(--line),0 14px 20px rgba(0,0,0,.15)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tag{box-shadow:0 3px 0 var(--line)}
@media (prefers-reduced-motion:reduce){.emoji{animation:none}}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.opt,.card{animation:in .3s}
.opt:active{transform:scale(.99)}
.link{background:none;color:var(--muted);padding:8px 0;margin-top:14px;font-size:.9rem}
ul.uni{padding-left:20px;margin:0}
ul.uni li{margin:6px 0}
.credit{text-align:center;margin-top:28px;font-size:.9rem;color:var(--muted)}
.credit b{color:var(--text)}
.themes{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;font-size:.85rem;color:var(--muted)}
.themes button{background:var(--card);color:var(--text);border:2px solid var(--line);padding:6px 12px;border-radius:99px;font-size:.85rem}
.themes button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
body[data-style="neon"]{--bg:#05060f;--card:#0d1024;--text:#e8f6ff;--muted:#8fa3c7;--accent:#22e6ff;--accent2:#ff2bd6;--line:#23305c;--bar:#18204a}
body[data-style="neon"] .card{border:1px solid var(--accent);box-shadow:0 0 26px rgba(34,230,255,.25)}

body[data-style="neon"] .primary{color:#05060f;box-shadow:0 0 20px var(--accent),0 6px 0 #0a7f91}
body[data-style="neon"] .opt:hover{box-shadow:0 0 16px var(--accent2)}
body[data-style="pastel"]{--bg:#fff0f6;--card:#ffffff;--text:#3b2f4a;--muted:#8a7b9a;--accent:#ec6fa7;--accent2:#8b7cf6;--line:#f3d6e6;--bar:#fbe3ef}
body[data-style="pastel"] .card{border-radius:30px;box-shadow:0 12px 30px rgba(236,111,167,.2)}
body[data-style="pastel"] .opt{border-radius:22px}
body[data-style="pastel"] .primary{box-shadow:0 6px 0 #c2467f,0 12px 20px rgba(236,111,167,.35)}
body[data-style="retro"]{--bg:#fff3b0;--card:#ffffff;--text:#111;--muted:#444;--accent:#ff5a36;--accent2:#ffb700;--line:#111;--bar:#ffe27a;font-family:"Courier New",ui-monospace,monospace}
body[data-style="retro"] #bg{display:none}
body[data-style="retro"] .card{background:var(--card);backdrop-filter:none;-webkit-backdrop-filter:none;border:3px solid #111;border-radius:0;box-shadow:7px 7px 0 #111}
body[data-style="retro"] .opt,body[data-style="retro"] .tag,body[data-style="retro"] .primary,body[data-style="retro"] .ghost,body[data-style="retro"] .themes button,body[data-style="retro"] .prog,body[data-style="retro"] .bar,body[data-style="retro"] .bar i{border-radius:0}
body[data-style="retro"] .primary{background:var(--accent);box-shadow:4px 4px 0 #111;border:3px solid #111}
body[data-style="retro"] .tag{border:2px solid #111;box-shadow:none}
body[data-style="retro"] .emoji{animation:none}
body[data-style="ocean"]{--bg:#0b2f5b;--card:rgba(255,255,255,.14);--text:#ffffff;--muted:#cfe6ff;--accent:#7dd3fc;--accent2:#34d399;--line:rgba(255,255,255,.28);--bar:rgba(255,255,255,.18);background:linear-gradient(160deg,#0a2a5e,#0e7490 60%,#14b8a6)}
body[data-style="ocean"] .card{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);box-shadow:0 14px 34px rgba(0,30,60,.35)}
body[data-style="ocean"] .opt{background:rgba(255,255,255,.1)}
body[data-style="ocean"] .primary{color:#06304f;box-shadow:0 6px 0 #0e7490,0 14px 22px rgba(0,0,0,.25)}
</style>
